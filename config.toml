# ---------------------------------------------------------------- news
[news]
enabled = true
interval_min = 10
max_age_hours = 8
max_per_run = 4
min_score = 4.5      # an item needs this much keyword weight to be sent
high_score = 7       # at or above this it notifies loudly and gets a 🔥
# crypto feeds must mention one of these
relevance = ['\bbitcoin\b', '\bbtc\b', '\bcrypto', 'digital asset', '\bstablecoin', '\betf\b']

[news.keywords]   # regex = weight (title hit full weight, summary-only hit half)
'\bhack(ed|s|er|ers)?\b' = 6
'\bexploit' = 6
'\bdrain(ed)?\b' = 5
'\bstolen\b' = 5
'\binsolven' = 6
'\bbankrupt' = 6
'halt(s|ed)? withdrawals' = 6
'\bintermeeting\b' = 6
'\bemergency\b' = 4
'\bdepeg' = 6
'\bseiz(e|ed|ure)' = 4
'\bban(s|ned)?\b' = 4
'strategic bitcoin reserve' = 5
'rate (hike|cut|increase|rise)' = 5
'\b(raises?|hikes?|cuts?|lowers?|holds?|keeps?) (interest )?rates?\b' = 5
'\bfomc\b' = 4
'\bwarsh\b' = 3
'\bcpi\b|\binflation\b' = 3
'\bpayrolls?\b|jobs report' = 3
'etf (in|out)flows?|(in|out)flows? from .*etf' = 4.5
'\bibit\b|\bblackrock\b' = 2
'\bsaylor\b|\bstrategy (buys|bought|sells|sold|adds|acquires)' = 4
'clarity act|market structure bill' = 5
'\bsec\b' = 3
'stablecoin (bill|law|act)' = 3
'\btreasury\b' = 2
'\btariffs?\b' = 3
'\bliquidat' = 3
'\bcapitulat' = 3
'\bcrash' = 3
'\bplunge|\btumble|\bsurge|\bsoar' = 2
'all-time high|record high' = 4
'\bnasdaq\b|\bnvidia\b' = 2
'\bwhales?\b' = 2
'mt\.? ?gox' = 4
'\btether\b|\busdt\b' = 3
'\bbinance\b' = 3
'north korea|lazarus' = 3

