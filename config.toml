# BTC alert bot configuration. Edit freely; the next run picks up changes.
# All event times are UTC ("Z"). UK is on UTC until 29 Mar 2027, so they match UK clock time.

timezone = "Europe/London"   # how times are shown in messages

[alerts]
level_buffer_pct = 0.15        # price must clear a level by this % to count as a break (stops chop spam)
level_cooldown_min = 240       # don't re-alert the same level within this window
move_1h_pct = 3.0              # fast-move alert thresholds
move_24h_pct = 6.0
move_cooldown_min = 120
rsi_low = 30
rsi_high = 70
weekly_close_warning_hours = 2 # heads-up before Sunday-night weekly close (00:00 UTC Monday)
fng_extreme_fear = 20
fng_extreme_greed = 80
funding_high_pct = 0.05        # Deribit perp funding per 8h
funding_low_pct = -0.02
sentiment_interval_min = 60
warn_after_failures = 6

[digest]
enabled = true
hour = 8                       # morning brief, local time

# ---------------------------------------------------------------- moving levels
# Recomputed every run from Coinbase daily candles, using the live price for the
# current candle (same as TradingView's intrabar values).
[dynamic_levels]
track = ["sma50w", "ema50w", "sma200w", "sma50d", "ema50d", "sma200d", "avwap_ytd"]
major = ["sma50w", "sma200w", "sma200d", "avwap_ytd"]
avwap_anchor = "2026-01-01"

# ---------------------------------------------------------------- static levels
# importance = "major" -> normal alert; "minor" -> silent notification
[[levels]]
price = 87000
name = "Range high / short-liquidation cluster"
note = "Sep-Oct highs; largest short cluster per Glassnode. Squeeze target."

[[levels]]
price = 82300
name = "Yearly AVWAP +1σ band"
importance = "minor"

[[levels]]
price = 81500
name = "US spot ETF avg cost basis"
note = "Above = ETF holders back in profit; below = rallies may meet ETF selling."

[[levels]]
price = 77700
name = "True Market Mean (your blue line)"
note = "Reclaim is the first sign bulls have control again."

[[levels]]
price = 75700
name = "Short-term holder cost basis"
note = "Recent buyers' break-even. Losing it risks loss-selling."

[[levels]]
price = 70000
name = "$70k / top of volume node"
importance = "minor"

[[levels]]
price = 68000
name = "Volume POC (your red line)"
note = "Heaviest traded zone of 2026; overlaps 200W SMA."

[[levels]]
price = 63000
name = "Top of $60-63k on-chain block"
importance = "minor"

[[levels]]
price = 60000
name = "Feb low / $60k"

[[levels]]
