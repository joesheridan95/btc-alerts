name: btc-alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by a few minutes at busy times
  workflow_dispatch: {}     # "Run workflow" button for testing

permissions:
  contents: write           # only used to commit weekly_log.md once a week

concurrency:
  group: btc-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore bot state
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts.py --state .state/state.json

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # Weekly close log gets committed once a week. This also keeps the repo
      # "active", so GitHub doesn't pause the schedule after 60 quiet days.
      - name: Commit weekly log
        run: |
          if [[ -n "$(git status --porcelain weekly_log.md)" ]]; then
            git config user.name "btc-alerts-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weekly_log.md
            git commit -m "Weekly close $(date -u +%F)"
            git push
          fi
